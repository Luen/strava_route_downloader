<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Strava Route Downloader</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f4ef;
      --card: #ffffff;
      --text: #1f2328;
      --muted: #5f6b7a;
      --accent: #fc4c02;
      --accent-dark: #d94400;
      --border: #d8dee4;
      --error: #b42318;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111418;
        --card: #1a1f24;
        --text: #f3f4f6;
        --muted: #9aa4b2;
        --border: #2d3640;
        --error: #ff8f85;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, var(--bg), color-mix(in srgb, var(--bg), var(--accent) 8%));
      color: var(--text);
      padding: 1.25rem;
    }

    main {
      max-width: 560px;
      margin: 0 auto;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 1.5rem;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0 0 0.5rem;
      font-size: 1.75rem;
      line-height: 1.2;
    }

    p {
      margin: 0 0 1.25rem;
      color: var(--muted);
      line-height: 1.5;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.4rem;
    }

    input,
    select,
    button {
      width: 100%;
      font: inherit;
      border-radius: 12px;
      border: 1px solid var(--border);
      padding: 0.9rem 1rem;
    }

    input,
    select {
      background: transparent;
      color: inherit;
      margin-bottom: 1rem;
    }

    button {
      border: none;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover:not(:disabled) {
      background: var(--accent-dark);
    }

    button:disabled {
      opacity: 0.7;
      cursor: wait;
    }

    .status {
      min-height: 1.25rem;
      margin-top: 1rem;
      font-size: 0.95rem;
    }

    .status.error {
      color: var(--error);
    }

    .status.loading {
      color: var(--muted);
    }

    .github-corner {
      position: fixed;
      top: 0;
      right: 0;
      z-index: 10;
      color: var(--text);
      border: 0;
    }

    .github-corner svg {
      display: block;
      width: 80px;
      height: 80px;
      fill: var(--accent);
      color: #fff;
    }

    .github-corner .octo-arm {
      transform-origin: 130px 106px;
    }

    .github-corner:hover .octo-arm {
      animation: octocat-wave 560ms ease-in-out;
    }

    @keyframes octocat-wave {
      0%,
      100% {
        transform: rotate(0);
      }
      20%,
      60% {
        transform: rotate(-25deg);
      }
      40%,
      80% {
        transform: rotate(10deg);
      }
    }

    @media (max-width: 500px) {
      .github-corner svg {
        width: 64px;
        height: 64px;
      }

      .github-corner:hover .octo-arm {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <a
    class="github-corner"
    href="https://github.com/Luen/strava_route_downloader"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="View source on GitHub"
  >
    <svg viewBox="0 0 250 250" aria-hidden="true">
      <path d="M0,0 L115,115 L130,115 L142,142 L250,250 L250,0 Z"></path>
      <path
        class="octo-arm"
        fill="currentColor"
        d="M128.3,109.0 C113.8,99.7 119.0,89.3 119.0,89.3 C122.0,82.7 120.5,78.6 120.5,78.6 C119.2,72.0 123.4,76.3 123.4,76.3 C127.3,80.9 125.5,87.3 125.5,87.3 C122.9,97.6 130.6,101.9 134.4,103.2"
      ></path>
      <path
        class="octo-body"
        fill="currentColor"
        d="M115.0,115.0 C114.9,115.1 118.7,116.5 119.8,115.4 L133.7,101.6 C136.9,99.2 139.9,98.4 142.2,98.6 C133.8,88.0 127.5,74.4 143.8,58.0 C148.5,53.4 154.0,51.2 159.7,51.0 C160.3,49.4 163.2,43.6 171.4,40.1 C171.4,40.1 176.1,42.5 178.8,56.2 C183.1,58.6 187.2,61.8 190.9,65.4 C194.5,69.0 197.7,73.2 200.1,77.6 C213.8,80.2 216.3,84.9 216.3,84.9 C212.7,93.1 206.9,96.0 205.4,96.6 C205.1,102.4 203.0,107.8 198.3,112.5 C181.9,128.9 168.3,122.5 157.7,114.1 C157.9,116.9 156.7,120.9 152.7,124.9 L141.0,136.5 C139.8,137.7 141.6,141.9 141.8,141.8 Z"
      ></path>
    </svg>
  </a>

  <main>
    <section class="card">
      <h1>Strava Route Downloader</h1>
      <p>Paste a Strava route link and download it as GPX, KML, or GeoJSON.</p>

      <form id="convert-form">
        <label for="url">Strava route URL</label>
        <input
          id="url"
          name="url"
          type="url"
          inputmode="url"
          autocomplete="url"
          placeholder="https://strava.app.link/..."
          required
        >

        <label for="format">Format</label>
        <select id="format" name="format">
          <option value="gpx" selected>GPX</option>
          <option value="kml">KML</option>
          <option value="geojson">GeoJSON</option>
        </select>

        <button type="submit" id="submit-btn">Download route</button>
      </form>

      <div id="status" class="status" aria-live="polite"></div>
    </section>
  </main>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
