services:
  web:
    build: .
    ports:
      - "7650:8000"
    restart: unless-stopped
    environment:
      CACHE_DIR: /data/cache
      STRAVA_COOKIES_FILE: /run/secrets/strava-cookies/strava-cookies.json
    volumes:
      - strava-cache:/data/cache
      - ${STRAVA_COOKIES_DIR:-./strava-cookies}:/run/secrets/strava-cookies:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

volumes:
  strava-cache:
